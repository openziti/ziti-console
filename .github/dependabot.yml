version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/projects/ziti-console-lib"
    schedule:
      interval: "weekly"
    # Two version-update groups can each open a PR, so the limit must be >= 2.
    open-pull-requests-limit: 5
    # The library requires these Angular and UI packages at their current major, so
    # a major bump breaks the install and stops Dependabot. Skip majors for them.
    ignore:
      - dependency-name: "@angular*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ngtools/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ng-packagr"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ag-grid-community"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ag-grid-angular"
        update-types: ["version-update:semver-major"]
      - dependency-name: "primeng"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-oauth2-oidc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ngx-lottie"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angularx-qrcode"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rxjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Angular and the packages tied to it have to update together, or the install fails.
      angular:
        applies-to: version-updates
        patterns:
          - "@angular*"
          - "@ngtools/*"
          - "ng-packagr"
          - "zone.js"
          - "rxjs"
          - "typescript"
      all-deps:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@angular*"
          - "@ngtools/*"
          - "ng-packagr"
          - "zone.js"
          - "rxjs"
          - "typescript"
      all-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Same library requirement as above, so skip the major bumps here too.
    ignore:
      - dependency-name: "@angular*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ngtools/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ng-packagr"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ag-grid-community"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ag-grid-angular"
        update-types: ["version-update:semver-major"]
      - dependency-name: "primeng"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-oauth2-oidc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ngx-lottie"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angularx-qrcode"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rxjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - "@angular*"
          - "@ngtools/*"
          - "ng-packagr"
          - "zone.js"
          - "rxjs"
          - "typescript"
      all-deps:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@angular*"
          - "@ngtools/*"
          - "ng-packagr"
          - "zone.js"
          - "rxjs"
          - "typescript"
      all-security:
        applies-to: security-updates
        patterns:
          - "*"
