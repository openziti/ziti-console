on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing config-builder release tag to build and attach config-builder.zip to
        required: true

name: Create Releases

permissions:
  id-token: write  # Required for OIDC. see https://docs.npmjs.com/trusted-publishers#supported-cicd-providers
  contents: read

jobs:
  build-and-publish-app-ziti-console:
    if: startsWith(github.event.release.name, 'app-ziti-console-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      BUILD_CONFIG: "Release"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
      - name: build and upload ziti-console.zip as SPA for use with controller
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        run: |
          ./build.sh ./
          cd dist/app-ziti-console && zip -r ziti-console.zip *
          gh release upload ${{github.event.release.tag_name}} ziti-console.zip

  build-and-publish-config-builder:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.name, 'config-builder-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: build config-builder.zip and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node ./scripts/package-config-builder.mjs --build --upload "$RELEASE_TAG"

  build-and-publish-ziti-console-lib:
    if: startsWith(github.event.release.name, 'ziti-console-lib-v')
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIG: "Release"
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Set VERSION Environment Variable
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Set VERSION Environment Variable
        run: |
          VERSION=$(echo "${{ github.event.release.name }}" | grep -oP '^.*-v(.*)$')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build and Publish Shared Library - ziti-console-lib
        if: github.repository_owner == 'openziti'
        run: ./publishSharedLib.sh
