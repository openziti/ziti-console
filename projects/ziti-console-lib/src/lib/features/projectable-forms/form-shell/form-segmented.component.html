<div class="seg" role="radiogroup" [attr.aria-label]="ariaLabel || null">
  @for (option of options; track option.value) {
    <button type="button" role="radio" [attr.aria-checked]="option.value === value" [class.on]="option.value === value" [disabled]="disabled" (click)="select(option)">{{option.label}}</button>
  }
</div>
