<header class="fph">
  <button type="button" class="fph-back" (click)="back.emit()">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6" /></svg>
    {{backLabel}}
  </button>
  <div class="fph-titlerow">
    <div class="fph-titlegroup">
      <h1 class="fph-title">
        <span class="fph-heading">{{heading}}</span>
        @if (name) {
          <span class="fph-sep">:</span>
          <span class="fph-name" [matTooltip]="name" matTooltipPosition="below" [matTooltipShowDelay]="0">{{name}}</span>
        }
      </h1>
    </div>
    <div class="fph-actions"><ng-content></ng-content></div>
  </div>
  @if (badges.length) {
    <div class="fph-badges">
      @for (badge of badges; track badge) {
          <span class="fph-badge {{badge.class}}">
            @if (badge.circle) {
              <span class="fph-badge-dot {{badge.circle}}"></span>
            }
            {{badge.label}}
          </span>
        }
    </div>
  }
</header>
